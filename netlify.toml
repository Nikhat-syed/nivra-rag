# Netlify Production Build & SPA Configuration for Nivra

[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

# Proxy /api/ requests to live HTTPS backend URL
[[redirects]]
  from = "/api/*"
  to = "https://nivra-backend-production.up.railway.app/api/:splat"
  status = 200

# SPA Fallback Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
