# Netlify Production Build & SPA Configuration for Nivra

[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

# Proxy /api/ requests to live HTTPS backend tunnel
[[redirects]]
  from = "/api/*"
  to = "https://7a31be66a1f0c4.lhr.life/api/:splat"
  status = 200

# SPA Fallback Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
